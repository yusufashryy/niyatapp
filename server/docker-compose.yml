# docker compose up -d --build   (see README.md)
services:
  check:
    build: .
    env_file: .env
    environment:
      NIYAT_TRUST_PROXY: "1"
    expose: ["8080"]
    restart: unless-stopped
    mem_limit: 6g

  # HTTPS in front, with a free certificate from Let's Encrypt.
  caddy:
    image: caddy:2.10
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [check]

volumes:
  caddy_data:
  caddy_config:
