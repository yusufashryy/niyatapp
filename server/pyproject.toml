[project]
name = "niyat-check"
version = "0.1.0"
description = "Niyat's recitation check: Quran Muaalem behind a small HTTP service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "quran-muaalem==0.3.0",
    # quran-muaalem 0.3.0 imports a private name that transformers 5 removed.
    "transformers>=4.55,<4.58",
    "torch>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "rapidfuzz>=3.10",
    "numpy>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["niyat_check"]
