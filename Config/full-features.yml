# Extra pieces that need a PAID Apple Developer account ($99/year):
#   - Prayer Lock: blocks chosen apps at prayer time (Apple's Screen Time API,
#     "Family Controls" capability)
#   - Time Sensitive notifications: prayer alerts break through Focus modes
#   - Groups: private accountability circles through iCloud (CloudKit) sharing
#   - Apple Watch app + watch face complications (a free account only allows
#     three app IDs, and the iPhone app + widgets already use two)
#
# Turned on with `make full`, which runs `NIYAT_FULL=true xcodegen`.
# Paths are from the repository root.
# Merged into project.yml: lists are appended, dictionaries are combined.

targets:
  Niyat:
    sources:
      - path: PrayerLock/Shared
      - path: Watch/Shared
    dependencies:
      - target: FocusMonitor
      - target: FocusShield
      - target: NiyatWatch
    entitlements:
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        # Groups: iCloud (CloudKit) sharing between members.
        com.apple.developer.icloud-container-identifiers: [iCloud.$(BUNDLE_ID_PREFIX).niyat]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SCREEN_TIME GROUPS WATCH

  # Runs in the background when a prayer window starts/ends and locks/unlocks apps.
  FocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerLock/Monitor
      - path: Shared
      - path: PrayerLock/Shared
    dependencies:
      - package: Adhan
    info:
      path: PrayerLock/Monitor/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyat Prayer Lock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusMonitorExtension
        NiyatAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: PrayerLock/Monitor/Support/FocusMonitor.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyat.FocusMonitor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SCREEN_TIME

  # Draws the "It's time for Dhuhr" screen shown over blocked apps.
  FocusShield:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerLock/Shield
      - path: Shared
      - path: PrayerLock/Shared
    dependencies:
      - package: Adhan
    info:
      path: PrayerLock/Shield/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyat Prayer Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
        NiyatAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: PrayerLock/Shield/Support/FocusShield.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyat.FocusShield
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SCREEN_TIME

  # The Apple Watch app: next prayer, today's times, log a prayer from the wrist.
  NiyatWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/App
      - path: Watch/Shared
      - path: Shared
      - path: Niyat/Resources/Fonts/AmiriQuran-Regular.ttf
        buildPhase: resources
      - path: Niyat/Resources/Fonts/ArefRuqaa-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: Adhan
      - target: NiyatWatchWidgets
    info:
      path: Watch/App/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [AmiriQuran-Regular.ttf, ArefRuqaa-Bold.ttf]
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).Niyat
        NiyatAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Watch/App/Support/NiyatWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyat.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Watch face complications.
  NiyatWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/Widgets
      - path: Shared
      - path: Niyat/Resources/Fonts/AmiriQuran-Regular.ttf
        buildPhase: resources
      - path: Niyat/Resources/Fonts/ArefRuqaa-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: Adhan
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Watch/Widgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyat Complications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [AmiriQuran-Regular.ttf, ArefRuqaa-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NiyatAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Watch/Widgets/Support/NiyatWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyat.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
