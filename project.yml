# XcodeGen project definition. Don't edit Niyati.xcodeproj by hand —
# edit this file and run `make` (see README.md).
name: Niyati

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.5.0"

# Prayer Lock (Screen Time) needs a paid Apple Developer account, so it lives in
# its own file and is only switched on by `make full`.
include:
  - path: full-features.yml
    enable: ${NIYATI_FULL}

targets:
  Niyati:
    type: application
    platform: iOS
    sources:
      - path: Niyati
      - path: Shared
    dependencies:
      - package: Adhan
      - target: NiyatiWidgets
    info:
      path: Niyati/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyati
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [AmiriQuran-Regular.ttf]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        NSLocationWhenInUseUsageDescription: Niyati uses your location to calculate accurate prayer times and the Qibla direction. Your location never leaves your phone.
        ITSAppUsesNonExemptEncryption: false
        NiyatiAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Niyati/Support/Niyati.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    scheme:
      testTargets: [NiyatiTests, NiyatiUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyati
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NiyatiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NiyatiWidgets
      - path: Shared
      - path: Niyati/Resources/Fonts/AmiriQuran-Regular.ttf
        buildPhase: resources
    dependencies:
      - package: Adhan
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NiyatiWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyati Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [AmiriQuran-Regular.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NiyatiAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: NiyatiWidgets/Support/NiyatiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyati.Widgets

  NiyatiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NiyatiTests
    dependencies:
      - target: Niyati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).NiyatiTests
        GENERATE_INFOPLIST_FILE: YES

  # Demo tour: taps through every screen (see README > Tests).
  NiyatiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NiyatiUITests
    dependencies:
      - target: Niyati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).NiyatiUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Niyati
