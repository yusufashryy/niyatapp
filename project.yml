# XcodeGen project definition. Don't edit Salah.xcodeproj by hand —
# edit this file and run `make` (see README.md).
name: Salah

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.5.0"

# Prayer Lock (Screen Time) needs a paid Apple Developer account, so it lives in
# its own file and is only switched on by `make full`.
include:
  - path: full-features.yml
    enable: ${SALAH_FULL}

targets:
  Salah:
    type: application
    platform: iOS
    sources:
      - path: Salah
      - path: Shared
    dependencies:
      - package: Adhan
      - target: SalahWidgets
    info:
      path: Salah/Support/Info.plist
      properties:
        CFBundleDisplayName: Salah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [AmiriQuran-Regular.ttf]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        NSLocationWhenInUseUsageDescription: Salah uses your location to calculate accurate prayer times and the Qibla direction. Your location never leaves your phone.
        ITSAppUsesNonExemptEncryption: false
        SalahAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Salah/Support/Salah.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    scheme:
      testTargets: [SalahTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Salah
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SalahWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SalahWidgets
      - path: Shared
      - path: Salah/Resources/Fonts/AmiriQuran-Regular.ttf
        buildPhase: resources
    dependencies:
      - package: Adhan
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: SalahWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Salah Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [AmiriQuran-Regular.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SalahAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: SalahWidgets/Support/SalahWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Salah.Widgets

  SalahTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SalahTests
    dependencies:
      - target: Salah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SalahTests
        GENERATE_INFOPLIST_FILE: YES
