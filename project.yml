# XcodeGen project definition. Don't edit Niyat.xcodeproj by hand —
# edit this file and run `make` (see README.md).
name: Niyat

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Marks the project as up to date with Xcode 27's recommended settings.
  xcodeVersion: "27.0"
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "13"
    # iPhone and iPad.
    TARGETED_DEVICE_FAMILY: "1,2"
    # Xcode's recommended settings.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    CODE_SIGN_STYLE: Automatic

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.5.0"
  # Runs the built-in recitation model on the iPhone.
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.20.0"

# Prayer Lock (Screen Time) needs a paid Apple Developer account, so it lives in
# its own file and is only switched on by `make full`.
include:
  - path: Config/full-features.yml
    relativePaths: false
    enable: ${NIYAT_FULL}

targets:
  Niyat:
    type: application
    platform: iOS
    sources:
      - path: Niyat
      - path: Shared
    dependencies:
      - package: Adhan
      - package: onnxruntime
        product: onnxruntime
      - target: NiyatWidgets
    info:
      path: Niyat/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # iPhone: portrait. iPad: any way round, and side by side with other apps.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts: [AmiriQuran-Regular.ttf, ArefRuqaa-Bold.ttf]
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        NSMicrophoneUsageDescription: Niyat listens while you recite so it can follow along and point out words to double-check. Nothing is recorded or saved.
        NSSpeechRecognitionUsageDescription: Niyat uses Apple's speech recognition to follow your recitation word by word, and to line up reciters' recordings with the text. When your iPhone supports it, this happens entirely on the device.
        NSLocationWhenInUseUsageDescription: Niyat uses your location to calculate accurate prayer times and the Qibla direction. Your location never leaves your phone.
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [niyat]
        NiyatAppGroup: $(APP_GROUP_ID)
        NiyatAppStoreID: $(APP_STORE_ID)
        NiyatFeedbackEmail: $(FEEDBACK_EMAIL)
        NiyatDiscordWebhook: $(DISCORD_WEBHOOK)
    entitlements:
      path: Niyat/Support/Niyat.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    # The recitation model isn't in git (166 MB): stop the build if `make model` hasn't fetched it,
    # rather than shipping an app that silently falls back to Apple's speech recognition.
    preBuildScripts:
      - name: Check the recitation model
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Niyat/Resources/RecitationModel/qurankarim-fastconformer-q8.onnx
          - $(SRCROOT)/Niyat/Resources/RecitationModel/recitation-model-tokens.txt
        script: |
          if [ ! -s "$SRCROOT/Niyat/Resources/RecitationModel/qurankarim-fastconformer-q8.onnx" ] || [ ! -s "$SRCROOT/Niyat/Resources/RecitationModel/recitation-model-tokens.txt" ]; then
            echo "error: The recitation model is missing. In Terminal, in the project folder, run: make model (then make full)"
            exit 1
          fi
    # ONNX Runtime's prebuilt onnxruntime.framework has a MinimumOSVersion App Store
    # Connect rejects (ITMS-90208). Set it to the app's own minimum iOS, then re-sign
    # the framework (its signature covers the Info.plist).
    postBuildScripts:
      - name: Fix ONNX Runtime's minimum iOS version
        basedOnDependencyAnalysis: false
        script: |
          FW="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/onnxruntime.framework"
          [ -d "$FW" ] || exit 0
          PLIST="$FW/Info.plist"
          echo "onnxruntime.framework MinimumOSVersion was: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST" 2>/dev/null || echo missing)"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $IPHONEOS_DEPLOYMENT_TARGET" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $IPHONEOS_DEPLOYMENT_TARGET" "$PLIST"
          echo "onnxruntime.framework MinimumOSVersion now: $IPHONEOS_DEPLOYMENT_TARGET"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,flags --timestamp=none "$FW"
          fi
    scheme:
      testTargets: [NiyatTests, NiyatUITests]
      # Test the Support Niyat tips in Xcode without App Store Connect.
      storeKitConfiguration: Config/Niyat.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyat
        # The ONNX Runtime fix-up script edits and re-signs the embedded framework.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NiyatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NiyatWidgets
      - path: Shared
      - path: Niyat/Resources/Fonts/AmiriQuran-Regular.ttf
        buildPhase: resources
      - path: Niyat/Resources/Fonts/ArefRuqaa-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: Adhan
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NiyatWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Niyat Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [AmiriQuran-Regular.ttf, ArefRuqaa-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NiyatAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: NiyatWidgets/Support/NiyatWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Niyat.Widgets

  NiyatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NiyatTests
    dependencies:
      - target: Niyat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).NiyatTests
        GENERATE_INFOPLIST_FILE: YES

  # Demo tour: taps through every screen (see README > Tests).
  NiyatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NiyatUITests
    dependencies:
      - target: Niyat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).NiyatUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Niyat
