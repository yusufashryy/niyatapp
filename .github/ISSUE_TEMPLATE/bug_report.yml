name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 15, iOS 27.0
  - type: input
    id: location
    attributes:
      label: City and calculation method (for prayer time issues)
      placeholder: London, Moonsighting Committee
