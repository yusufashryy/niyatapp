name: Build & Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets the demo job update the demo-media branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: xcode-27  # macOS 27 + Xcode 27 (iOS 27 SDK and simulator)
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # basic = free Apple ID build, full = with Prayer Lock (Screen Time)
        variant: [basic, full]
    steps:
      - uses: actions/checkout@v5

      - run: mkdir -p demo

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make ${{ matrix.variant == 'full' && 'full' || 'project' }}

      - name: Check Prayer Lock targets are ${{ matrix.variant == 'full' && 'included' || 'left out' }}
        run: |
          if grep -q "FocusMonitor" Niyat.xcodeproj/project.pbxproj; then has=yes; else has=no; fi
          echo "Prayer Lock targets present: $has"
          [ "$has" = "${{ matrix.variant == 'full' && 'yes' || 'no' }}" ]

      - name: Check the privacy manifests are bundled
        run: |
          count=$(grep -c "PrivacyInfo.xcprivacy in Resources" Niyat.xcodeproj/project.pbxproj || true)
          echo "Privacy manifests in Resources: $count"
          [ "$count" -ge ${{ matrix.variant == 'full' && '4' || '2' }} ]

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          # The biggest iPhone, so demo screenshots are the size the App Store asks for (6.9").
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
                  best = [d for d in phones if "Pro Max" in d["name"]] or phones
                  if best:
                      print(best[0]["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Niyat.xcodeproj \
            -scheme Niyat \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:NiyatTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # An unsigned .ipa of the basic build, for friends to install with a
      # sideloading tool (Sideloadly, AltStore), which signs it with their own Apple ID.
      - name: Build unsigned .ipa for sideloading
        if: matrix.variant == 'basic'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Niyat.xcodeproj \
            -scheme Niyat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ipa \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          mkdir -p build/ipa/Payload
          cp -R build/ipa/Build/Products/Release-iphoneos/Niyat.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../../Niyat-unsigned.ipa Payload)
          ls -la Niyat-unsigned.ipa

      - name: Upload .ipa
        if: matrix.variant == 'basic'
        uses: actions/upload-artifact@v7
        with:
          name: Niyat-unsigned-ipa
          path: Niyat-unsigned.ipa

      # Demo tour: taps through every screen and saves a screenshot of each.
      - name: Run demo tour
        if: matrix.variant == 'full'
        run: |
          set -o pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override \
            --time "$(TZ=Europe/London date +%H:%M)" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true
          xcodebuild test \
            -project Niyat.xcodeproj \
            -scheme Niyat \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:NiyatUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath demo/tour.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Export demo screenshots
        if: always() && matrix.variant == 'full'
        run: |
          mkdir -p demo/screenshots
          xcrun xcresulttool export attachments --path demo/tour.xcresult --output-path demo/raw
          python3 - <<'PY'
          import json, pathlib, shutil
          raw = pathlib.Path("demo/raw")
          diagnostics = pathlib.Path("demo/diagnostics")
          for test in json.loads((raw / "manifest.json").read_text()):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  # Keep only our numbered screenshots ("03 Today"), not Xcode's automatic attachments,
                  # except hang reports and failure details, which say why a tour failed.
                  if not name[:2].isdigit():
                      if name.startswith(("Spindump", "Debug description")):
                          diagnostics.mkdir(exist_ok=True)
                          clean = name.split("_0_")[0].replace("/", "-").replace("`", "")
                          shutil.copy(raw / a["exportedFileName"], diagnostics / f"{clean} {a['exportedFileName'][:8]}.txt")
                      continue
                  name = name.split("_0_")[0].replace("/", "-")
                  if not name.endswith(".png"):
                      name += ".png"
                  shutil.copy(raw / a["exportedFileName"], pathlib.Path("demo/screenshots") / name)
          PY
          ls -la demo/screenshots

      - name: Upload demo
        if: always() && matrix.variant == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: demo
          path: demo/screenshots

      # Also keep the latest demo on a separate branch (no shared history with
      # the code) so screenshots can be linked from the README.
      - name: Publish demo to the demo-media branch
        if: always() && matrix.variant == 'full' && github.event_name == 'push' && !startsWith(github.ref_name, 'dependabot/')
        # Screenshots only: a slow upload to GitHub shouldn't fail the build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p demo/publish
          cp -R demo/screenshots demo/publish/
          if [ -d demo/diagnostics ]; then cp -R demo/diagnostics demo/publish/; fi
          cd demo/publish
          git init -q -b demo-media
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-media
