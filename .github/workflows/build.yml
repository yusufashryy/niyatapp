name: Build & Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Actions › Build & Test › Run workflow: builds, tests, and (ticked by
  # default) takes the App Store screenshots on iPhone and iPad.
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take the App Store screenshots (iPhone and iPad demo tour)
        type: boolean
        default: true

permissions:
  contents: write  # lets the demo job update the demo-media branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: xcode-27  # macOS 27 + Xcode 27 (iOS 27 SDK and simulator)
    timeout-minutes: 60
    env:
      # Screenshots only when asked for (Run workflow with the box ticked).
      SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, for the file dates below

      # Reusing the last build: Xcode only rebuilds files whose date changed,
      # but a fresh checkout dates every file "now". Give each file the date
      # of the last commit that changed it instead, and tell Xcode not to
      # treat the new checkout's disk IDs as changes.
      - name: Date files by their last commit
        run: |
          python3 - <<'PY'
          import os, subprocess
          log = subprocess.run(["git", "log", "--format=@%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          seen, when = set(), 0
          for line in log.splitlines():
              if line.startswith("@"):
                  when = int(line[1:])
              elif line and line not in seen:
                  seen.add(line)
                  if os.path.exists(line):
                      os.utime(line, (when, when))
          PY
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Reuse the last build
        uses: actions/cache@v6
        with:
          path: build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'Config/*.yml') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'Config/*.yml') }}-
            deriveddata-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      # The full app: Prayer Lock, Groups, Time Sensitive alerts and Apple Watch.
      - name: Generate Xcode project
        run: make full

      - name: Check Prayer Lock targets are included
        run: grep -q "FocusMonitor" Niyat.xcodeproj/project.pbxproj

      - name: Check Groups uses the entitled iCloud container
        run: |
          grep -A1 "NiyatCloudContainer" Niyat/Support/Info.plist | grep -q 'iCloud\.$(BUNDLE_ID_PREFIX)\.niyat'
          grep -A2 "icloud-container-identifiers" Niyat/Support/Niyat.entitlements | grep -q 'iCloud\.$(BUNDLE_ID_PREFIX)\.niyat'

      - name: Check the privacy manifests are bundled
        run: |
          count=$(grep -c "PrivacyInfo.xcprivacy in Resources" Niyat.xcodeproj/project.pbxproj || true)
          echo "Privacy manifests in Resources: $count"
          [ "$count" -ge 6 ]

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          # The biggest iPhone, so demo screenshots are the size the App Store asks for (6.9").
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
                  best = [d for d in phones if "Pro Max" in d["name"]] or phones
                  if best:
                      print(best[0]["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Niyat.xcodeproj \
            -scheme Niyat \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:NiyatTests \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Demo tour (only when asked for): taps through every screen and saves
      # a screenshot of each, on the biggest iPhone and then the biggest iPad.
      - name: Run demo tour
        if: env.SCREENSHOTS == 'true'
        run: |
          set -o pipefail
          mkdir -p demo
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override \
            --time "$(TZ=Europe/London date +%H:%M)" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true
          xcodebuild test \
            -project Niyat.xcodeproj \
            -scheme Niyat \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:NiyatUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath demo/tour.xcresult \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # The same tour on the biggest iPad, for the App Store's iPad screenshots
      # (13", 2064 × 2752). Screenshots only: it doesn't fail the build.
      - name: Run demo tour on iPad
        if: env.SCREENSHOTS == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  pads = [d for d in devices[runtime] if d["name"].startswith("iPad Pro")]
                  best = [d for d in pads if "13" in d["name"]] or pads
                  if best:
                      print(best[0]["udid"]); sys.exit()
          ')
          echo "Using iPad $IPAD"
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override \
            --time "$(TZ=Europe/London date +%H:%M)" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcodebuild test \
            -project Niyat.xcodeproj \
            -scheme Niyat \
            -destination "id=$IPAD" \
            -only-testing:NiyatUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath demo/tour-ipad.xcresult \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Export demo screenshots
        if: always() && env.SCREENSHOTS == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          diagnostics = pathlib.Path("demo/diagnostics")
          for bundle, folder in [("demo/tour.xcresult", "screenshots"), ("demo/tour-ipad.xcresult", "screenshots-ipad")]:
              # A tour stopped part way (e.g. timed out) leaves no readable bundle.
              if not (pathlib.Path(bundle) / "Info.plist").exists():
                  print(f"No results in {bundle}")
                  continue
              raw = pathlib.Path(f"demo/raw-{folder}")
              if subprocess.run(["xcrun", "xcresulttool", "export", "attachments", "--path", bundle,
                                 "--output-path", str(raw)]).returncode != 0:
                  continue
              out = pathlib.Path("demo") / folder
              out.mkdir(parents=True, exist_ok=True)
              for test in json.loads((raw / "manifest.json").read_text()):
                  for a in test.get("attachments", []):
                      name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                      # Keep only our numbered screenshots ("03 Today"), not Xcode's automatic attachments,
                      # except hang reports and failure details, which say why a tour failed.
                      if not name[:2].isdigit():
                          if name.startswith(("Spindump", "Debug description")):
                              diagnostics.mkdir(exist_ok=True)
                              clean = name.split("_0_")[0].replace("/", "-").replace("`", "")
                              shutil.copy(raw / a["exportedFileName"], diagnostics / f"{folder} {clean} {a['exportedFileName'][:8]}.txt")
                          continue
                      name = name.split("_0_")[0].replace("/", "-")
                      if not name.endswith(".png"):
                          name += ".png"
                      shutil.copy(raw / a["exportedFileName"], out / name)
          PY
          ls -la demo/screenshots demo/screenshots-ipad || true

      - name: Upload demo
        if: always() && env.SCREENSHOTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demo
          path: |
            demo/screenshots
            demo/screenshots-ipad

      # Also keep the latest demo on a separate branch (no shared history with
      # the code) so screenshots can be linked from the README.
      - name: Publish demo to the demo-media branch
        if: always() && env.SCREENSHOTS == 'true'
        # Screenshots only: a slow upload to GitHub shouldn't fail the build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p demo/publish
          cp -R demo/screenshots demo/publish/
          if [ -d demo/screenshots-ipad ]; then cp -R demo/screenshots-ipad demo/publish/; fi
          if [ -d demo/diagnostics ]; then cp -R demo/diagnostics demo/publish/; fi
          cd demo/publish
          git init -q -b demo-media
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-media
